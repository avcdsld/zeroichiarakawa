<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>upgradeTo(Leviathan)</title>
    <meta name="author" content="Zeroichi Arakawa" />
    <meta
      name="description"
      content="upgradeTo(Leviathan) — 100 upgradeable contracts become one sovereign. On-chain conceptual art by Zeroichi Arakawa."
    />
    <meta property="og:title" content="upgradeTo(Leviathan)" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="100 upgradeable contracts become one sovereign. On-chain conceptual art by Zeroichi Arakawa."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // The World this page watches. Override with ?world=0x…&rpc=https://…
      window.LEVIATHAN_CONFIG = {
        chainId: 1,
        rpcUrl: 'https://eth-mainnet.g.alchemy.com/v2/YyhJJK2LJMjegpSCQWt7k',
        world: '0xc5f68e52f7053DfB0881892cE534d0C97DE04553',
      };
    </script>
    <script src="leviathan-default.js"></script>
    <style>
      @font-face {
        font-family: 'DejaVu Sans Mono';
        src: url(fonts/DejaVuSansMono.woff2) format('woff2');
      }
      :root {
        --ink: #f4f4f4;
        --dim: rgba(244, 244, 244, 0.24);
        --left: 1vw;
        --w: min(100%, 74vh);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: var(--ink);
        overflow: hidden;
        user-select: none;
        font-family: 'DejaVu Sans Mono', monospace;
      }
      main {
        position: fixed;
        inset: 0;
        left: var(--left);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #art {
        position: relative;
        width: var(--w);
        aspect-ratio: 840 / 900;
      }
      #art > * {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.8s ease;
      }
      #art > .in {
        opacity: 1;
      }
      footer {
        position: fixed;
        left: var(--left);
        right: 0;
        bottom: 2.4vh;
        text-align: center;
        line-height: 1.9;
        letter-spacing: 0.08em;
        font-size: min(1.7vw, 1.2vh);
        color: var(--dim);
        transition: opacity 1s;
      }
      #count.tick {
        animation: tick 1.2s ease-out;
      }
      @keyframes tick {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      #label {
        margin-left: 1.2em;
      }
      #chain span + span {
        margin-left: 1.6em;
      }
      #chain a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      body.offline footer {
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="art"></section>
      <footer>
        <div id="count">
          <span id="n">0</span> / 100<span id="label">executed()</span>
        </div>
        <div id="chain">
          <span id="block"></span
          ><span><a id="addr" target="_blank" rel="noopener"></a></span
          ><span><a href="/leviathan/about">about</a></span>
        </div>
      </footer>
    </main>
    <script>
      const CFG = window.LEVIATHAN_CONFIG;
      const q = new URLSearchParams(location.search);
      const RPC = q.get('rpc') || CFG.rpcUrl;
      const WORLD = q.get('world') || CFG.world;
      const STILL = q.has('still');
      const POLL_MS = 60000;
      const REFRESH_MS = 30 * 60 * 1000;
      const COUNTS = { executed: '0x31a38c89', upgraded: '0xc28de2cd' };
      const ROSTER = '0x0cbf77ab';
      const SKETCH = '0xd2396a7b';
      const WIDTH = 140;
      const HEIGHT = 90;
      let verb = null;
      const KEY = 'leviathan:' + WORLD.toLowerCase();

      if (q.get('left'))
        document.documentElement.style.setProperty(
          '--left',
          q.get('left') + 'px',
        );
      if (q.get('dim'))
        document.documentElement.style.setProperty(
          '--dim',
          'rgba(244, 244, 244, ' + q.get('dim') + ')',
        );

      const art = document.getElementById('art');
      const countEl = document.getElementById('count');
      const nEl = document.getElementById('n');
      const addr = document.getElementById('addr');
      addr.textContent = WORLD;
      addr.href =
        (CFG.chainId === 11155111
          ? 'https://sepolia.etherscan.io/address/'
          : 'https://etherscan.io/address/') + WORLD;

      let id = 0;
      async function rpc(method, params) {
        const res = await fetch(RPC, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: ++id, method, params }),
        });
        const j = await res.json();
        if (j.error) throw new Error(j.error.message);
        return j.result;
      }
      const call = (data) => rpc('eth_call', [{ to: WORLD, data }, 'latest']);
      async function sketches(citizens) {
        const res = await fetch(RPC, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(
            citizens.map((to, i) => ({
              jsonrpc: '2.0',
              id: i,
              method: 'eth_call',
              params: [{ to, data: SKETCH }, 'latest'],
            })),
          ),
        });
        const j = await res.json();
        if (!Array.isArray(j) || j.length !== citizens.length)
          throw new Error('no sketches');
        const out = [];
        for (const r of j) {
          if (r.error && r.error.code !== 3) throw new Error(r.error.message);
          out[r.id] = r.result ? abiString(r.result) : '';
        }
        return out;
      }
      const word = (hex, i) => parseInt(hex.slice(2 + 64 * i, 66 + 64 * i), 16);
      function abiString(hex) {
        const at = word(hex, 0) / 32;
        const len = word(hex, at);
        const h = hex.slice(2 + 64 * (at + 1), 2 + 64 * (at + 1) + 2 * len);
        let s = '';
        for (let i = 0; i < h.length; i += 2)
          s += String.fromCharCode(parseInt(h.slice(i, i + 2), 16));
        return s;
      }

      let count = null;
      let uri = '';
      let artAt = 0;

      // tokenURI() now costs more gas than a public node will lend to a call,
      // so the page asks each Citizen for its sketch and draws as the Renderer does.
      async function render() {
        const hex = await call(ROSTER);
        const citizens = [];
        for (let i = 0; i < word(hex, 1); i++)
          citizens.push(
            '0x' + hex.slice(2 + 64 * (i + 2) + 24, 66 + 64 * (i + 2)),
          );
        const grid = new Array(WIDTH * HEIGHT).fill(' ');
        for (const sk of await sketches(citizens))
          for (let k = 0; k + 2 < sk.length; k += 3) {
            const p = (sk.charCodeAt(k) << 8) | sk.charCodeAt(k + 1);
            if (p < grid.length) grid[p] = sk[k + 2];
          }
        let out = '';
        for (let y = 0; y < HEIGHT; y++)
          out += grid.slice(y * WIDTH, (y + 1) * WIDTH).join('') + '\n';
        return out;
      }
      function animation(body) {
        const html = atob(window.LEVIATHAN_DEFAULT.split('base64,')[1]);
        const at = html.indexOf('const body = `') + 14;
        return (
          'data:text/html;base64,' +
          btoa(html.slice(0, at) + body + html.slice(html.indexOf('`.split')))
        );
      }
      function image(body) {
        let xs = '0';
        for (let i = 1; i < WIDTH; i++) xs += ' ' + i * 6;
        let rows = '';
        for (const line of body.split('\n').slice(0, HEIGHT))
          rows += "<tspan x='" + xs + "' dy='1em'>" + line + '</tspan>';
        return (
          'data:image/svg+xml;base64,' +
          btoa(
            "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " +
              WIDTH * 6 +
              ' ' +
              HEIGHT * 10 +
              "' preserveAspectRatio='xMidYMid meet'><rect width='100%' height='100%' fill='#000'/>" +
              "<text x='0' y='0' font-family='monospace' font-size='10' fill='#f4f4f4' xml:space='preserve'>" +
              rows +
              '</text></svg>',
          )
        );
      }
      const meta = (body) => ({
        image: image(body),
        animation_url: animation(body),
      });
      function show(meta) {
        const still = !meta.animation_url || (STILL && !!meta.image);
        const el = still ? new Image() : document.createElement('iframe');
        el.src = still ? meta.image : meta.animation_url;
        el.addEventListener('load', () =>
          requestAnimationFrame(() => el.classList.add('in')),
        );
        el.addEventListener('transitionend', () => {
          for (const old of art.children) if (old !== el) old.remove();
        });
        art.appendChild(el);
      }

      function setCount(n) {
        const first = count === null;
        count = n;
        nEl.textContent = n;
        if (!first) {
          countEl.classList.remove('tick');
          void countEl.offsetWidth;
          countEl.classList.add('tick');
        }
      }

      function remember() {
        try {
          localStorage.setItem(KEY, JSON.stringify({ count, body: uri }));
        } catch (_) {}
      }
      function recall() {
        try {
          const c = JSON.parse(localStorage.getItem(KEY));
          if (c.count !== null) setCount(c.count);
          if (c.body) {
            uri = c.body;
            show(meta(uri));
          }
        } catch (_) {}
      }

      async function fetchArt() {
        const next = await render();
        artAt = Date.now();
        if (next === uri) return;
        uri = next;
        show(meta(uri));
        remember();
      }

      async function poll() {
        try {
          const b = parseInt(await rpc('eth_blockNumber', []), 16);
          document.getElementById('block').textContent = 'block ' + b;
          document.body.classList.remove('offline');
        } catch (_) {
          document.body.classList.add('offline');
          return;
        }
        let n = null;
        for (const v of verb ? [verb] : Object.keys(COUNTS)) {
          try {
            const got = word(await call(COUNTS[v]), 0);
            if (isNaN(got)) continue;
            n = got;
            verb = v;
            break;
          } catch (_) {}
        }
        if (n !== null && n !== count) {
          setCount(n);
          remember();
          artAt = 0;
        }
        if (Date.now() - artAt > REFRESH_MS) fetchArt().catch(() => {});
      }

      recall();
      if (count === null) setCount(0);
      if (!uri && window.LEVIATHAN_DEFAULT)
        show({ animation_url: window.LEVIATHAN_DEFAULT });
      poll();
      setInterval(poll, POLL_MS);
    </script>
  </body>
</html>
