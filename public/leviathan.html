<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>upgradeTo(Leviathan)</title>
    <meta name="author" content="Zeroichi Arakawa" />
    <meta
      name="description"
      content="upgradeTo(Leviathan) — 100 upgradeable contracts become one sovereign. On-chain conceptual art by Zeroichi Arakawa."
    />
    <meta property="og:title" content="upgradeTo(Leviathan)" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="100 upgradeable contracts become one sovereign. On-chain conceptual art by Zeroichi Arakawa."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // The World this page watches. Override with ?world=0x…&rpc=https://…
      window.LEVIATHAN_CONFIG = {
        chainId: 1,
        rpcUrl: 'https://eth-mainnet.public.blastapi.io',
        world: '0xc5f68e52f7053DfB0881892cE534d0C97DE04553',
      };
    </script>
    <script src="leviathan-default.js"></script>
    <style>
      @font-face {
        font-family: 'DejaVu Sans Mono';
        src: url(fonts/DejaVuSansMono.woff2) format('woff2');
      }
      :root {
        --ink: #f4f4f4;
        --dim: rgba(244, 244, 244, 0.24);
        --left: 1vw;
        --w: min(100%, 74vh);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: var(--ink);
        overflow: hidden;
        user-select: none;
        font-family: 'DejaVu Sans Mono', monospace;
      }
      main {
        position: fixed;
        inset: 0;
        left: var(--left);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #art {
        position: relative;
        width: var(--w);
        aspect-ratio: 840 / 900;
      }
      #art > * {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.8s ease;
      }
      #art > .in {
        opacity: 1;
      }
      footer {
        position: fixed;
        left: var(--left);
        right: 0;
        bottom: 2.4vh;
        text-align: center;
        line-height: 1.9;
        letter-spacing: 0.08em;
        font-size: min(1.7vw, 1.2vh);
        color: var(--dim);
        transition: opacity 1s;
      }
      #count.tick {
        animation: tick 1.2s ease-out;
      }
      @keyframes tick {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      #label {
        margin-left: 1.2em;
      }
      #chain span + span {
        margin-left: 1.6em;
      }
      #chain a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      body.offline footer {
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="art"></section>
      <footer>
        <div id="count">
          <span id="n">0</span> / 100<span id="label">executed()</span>
        </div>
        <div id="chain">
          <span id="block"></span
          ><span><a id="addr" target="_blank" rel="noopener"></a></span
          ><span><a href="/leviathan/about">about</a></span>
        </div>
      </footer>
    </main>
    <script>
      const CFG = window.LEVIATHAN_CONFIG;
      const q = new URLSearchParams(location.search);
      const RPC = q.get('rpc') || CFG.rpcUrl;
      const WORLD = q.get('world') || CFG.world;
      const STILL = q.has('still');
      const POLL_MS = 60000;
      const REFRESH_MS = 30 * 60 * 1000;
      const COUNTS = { executed: '0x31a38c89', upgraded: '0xc28de2cd' };
      const TOKEN_URI = '0xc87b56dd' + '0'.repeat(64);
      let verb = null;
      const KEY = 'leviathan:' + WORLD.toLowerCase();

      if (q.get('left'))
        document.documentElement.style.setProperty(
          '--left',
          q.get('left') + 'px',
        );
      if (q.get('dim'))
        document.documentElement.style.setProperty(
          '--dim',
          'rgba(244, 244, 244, ' + q.get('dim') + ')',
        );

      const art = document.getElementById('art');
      const countEl = document.getElementById('count');
      const nEl = document.getElementById('n');
      const addr = document.getElementById('addr');
      addr.textContent = WORLD;
      addr.href =
        (CFG.chainId === 11155111
          ? 'https://sepolia.etherscan.io/address/'
          : 'https://etherscan.io/address/') + WORLD;

      let id = 0;
      async function rpc(method, params) {
        const res = await fetch(RPC, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: ++id, method, params }),
        });
        const j = await res.json();
        if (j.error) throw new Error(j.error.message);
        return j.result;
      }
      const call = (data) => rpc('eth_call', [{ to: WORLD, data }, 'latest']);
      const word = (hex, i) => parseInt(hex.slice(2 + 64 * i, 66 + 64 * i), 16);
      function abiString(hex) {
        const at = word(hex, 0) / 32;
        const len = word(hex, at);
        const h = hex.slice(2 + 64 * (at + 1), 2 + 64 * (at + 1) + 2 * len);
        let s = '';
        for (let i = 0; i < h.length; i += 2)
          s += String.fromCharCode(parseInt(h.slice(i, i + 2), 16));
        return s;
      }

      let count = null;
      let uri = '';
      let artAt = 0;

      const meta = (u) => JSON.parse(atob(u.split('base64,')[1]));
      function show(meta) {
        const still = !meta.animation_url || (STILL && !!meta.image);
        const el = still ? new Image() : document.createElement('iframe');
        el.src = still ? meta.image : meta.animation_url;
        el.addEventListener('load', () =>
          requestAnimationFrame(() => el.classList.add('in')),
        );
        el.addEventListener('transitionend', () => {
          for (const old of art.children) if (old !== el) old.remove();
        });
        art.appendChild(el);
      }

      function setCount(n) {
        const first = count === null;
        count = n;
        nEl.textContent = n;
        if (!first) {
          countEl.classList.remove('tick');
          void countEl.offsetWidth;
          countEl.classList.add('tick');
        }
      }

      function remember() {
        try {
          localStorage.setItem(KEY, JSON.stringify({ count, uri }));
        } catch (_) {}
      }
      function recall() {
        try {
          const c = JSON.parse(localStorage.getItem(KEY));
          if (c.count !== null) setCount(c.count);
          if (c.uri) {
            uri = c.uri;
            show(meta(uri));
          }
        } catch (_) {}
      }

      async function fetchArt() {
        const next = abiString(await call(TOKEN_URI));
        if (!next.startsWith('data:')) throw new Error('no world at ' + WORLD);
        artAt = Date.now();
        if (next === uri) return;
        uri = next;
        show(meta(uri));
        remember();
      }

      async function poll() {
        try {
          const b = parseInt(await rpc('eth_blockNumber', []), 16);
          document.getElementById('block').textContent = 'block ' + b;
          document.body.classList.remove('offline');
        } catch (_) {
          document.body.classList.add('offline');
          return;
        }
        let n = null;
        for (const v of verb ? [verb] : Object.keys(COUNTS)) {
          try {
            const got = word(await call(COUNTS[v]), 0);
            if (isNaN(got)) continue;
            n = got;
            verb = v;
            break;
          } catch (_) {}
        }
        if (n !== null && n !== count) {
          setCount(n);
          remember();
          artAt = 0;
        }
        if (Date.now() - artAt > REFRESH_MS) fetchArt().catch(() => {});
      }

      recall();
      if (count === null) setCount(0);
      if (!uri && window.LEVIATHAN_DEFAULT)
        show({ animation_url: window.LEVIATHAN_DEFAULT });
      poll();
      setInterval(poll, POLL_MS);
    </script>
  </body>
</html>
