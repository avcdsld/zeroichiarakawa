          const o = y * W;
          for (let x = 0; x < W; x++) s += String.fromCharCode(grid[o + x]);
          tspans[y].textContent = s;
        }
        requestAnimationFrame(frame);
      }

      const CFG = window.LEVIATHAN_CONFIG || null;
      const params = new URLSearchParams(location.search);
      const showSlider = params.has('preview');
      const chainMode = !!(CFG && CFG.world) && !showSlider;

      // ---- preview (no live chain): play the one-way fill once, then breathe forever ----
      let count = 0,
        lastStep = 0;
      const order = Array.from({ length: TOTAL }, (_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      const slider = document.getElementById('slider');
      const countEl = document.getElementById('count');
      function applyCount() {
        chainStates.fill(false);
        for (let i = 0; i < count; i++) chainStates[order[i]] = true;
        slider.value = count;
        countEl.textContent =
          count >= TOTAL
            ? 'whole · breathing'
            : count + ' / ' + TOTAL + ' upgraded';
        mode = count >= TOTAL ? 'breath' : 'fill';
      }
      function setCount(c) {
        count = Math.max(0, Math.min(TOTAL, Math.round(c)));
        applyCount();
      }
      slider.addEventListener('input', (e) => {
        scrubbing = true;
        setCount(e.target.value);
      });
      let scrubbing = false;

      const FILL_MS = 260;
      function fillTick(ts) {
        if (mode !== 'fill' || scrubbing) return;
        if (ts - lastStep < FILL_MS) return;
        lastStep = ts;
        if (count < TOTAL) setCount(count + 1);
      }

      // ---- chain: read the real one-way state; once whole, each new block nudges the breath ----
      async function ensureEthers() {
        if (window.ethers) return;
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src =
            'https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js';
          s.onload = res;
          s.onerror = rej;
          document.head.appendChild(s);
        });
      }
      async function startChain() {
        try {
          await ensureEthers();
        } catch (_) {
          return;
        }
        const provider = new ethers.JsonRpcProvider(
          CFG.rpcUrl || 'http://127.0.0.1:8545',
        );
        const wc = new ethers.Contract(
          CFG.world,
          ['function states() view returns (bool[])'],
          provider,
        );
        let lastBlock = 0;
        async function tick() {
          try {
            if (mode === 'fill') {
              const s = await wc.states();
              let all = true;
              for (let i = 0; i < TOTAL; i++) {
                chainStates[i] = !!s[i];
                if (!s[i]) all = false;
              }
              if (all) mode = 'breath';
            }
            if (mode === 'breath') {
              const b = await provider.getBlockNumber();
              if (b !== lastBlock) {
                lastBlock = b;
                bt += 0.6;
              }
            }
          } catch (_) {}
        }
        tick();
        setInterval(tick, 5000);
      }

      if (chainMode) {
        startChain();
      } else {
        if (showSlider) document.body.classList.add('preview');
        setCount(0);
        const step = (ts) => {
          fillTick(ts);
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
